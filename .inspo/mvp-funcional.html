<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>my-story-maker — MVP funcional</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: ui-sans-serif, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, sans-serif;
      background: #f3f4f6; color: #111;
    }
    .app {
      display: grid;
      grid-template-columns: 260px 1fr 320px;
      height: 100vh;
    }
    @media (max-width: 1100px) {
      .app { grid-template-columns: 220px 1fr 280px; }
    }
    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    }

    /* Sidebar esquerda */
    .sidebar {
      background: #fff; border-right: 1px solid rgba(0,0,0,0.06);
      padding: 16px 12px; display: flex; flex-direction: column; gap: 8px;
    }
    .brand {
      font-weight: 800; letter-spacing: -0.3px; font-size: 18px; padding: 6px 10px;
    }
    .project { font-size: 12px; opacity: 0.6; padding: 2px 10px 10px; }
    .nav-item {
      display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px;
      font-size:13px; font-weight:600; cursor:pointer; border:1px solid transparent;
    }
    .nav-item:hover { background:#f6f6f6; }
    .nav-item.active { background:#111; color:#fff; }
    .icon {
      width: 28px; height: 28px; border-radius: 8px;
      background: #f6f6f6; display:flex; align-items:center; justify-content:center;
      font-size: 14px;
    }
    .nav-item.active .icon { background: rgba(255,255,255,0.2); color:#fff; }

    /* Centro */
    .center {
      display: flex; flex-direction: column; background: #f3f4f6;
    }
    .topbar {
      display:flex; align-items:center; justify-content: space-between;
      padding: 12px 18px; background: rgba(255,255,255,0.85); backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .topbar .actions { display:flex; gap:10px; }
    .btn {
      padding: 10px 14px; border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.08); background: #fff;
      font-weight: 700; font-size: 13px; cursor: pointer;
    }
    .btn.primary { background: #111; color: #fff; border-color: #111; }
    .canvas-wrap {
      flex: 1; display:flex; align-items:center; justify-content:center; padding: 18px;
    }
    .phone {
      width: 320px; aspect-ratio: 9/16; border-radius: 22px;
      background: #fff; box-shadow: 0 25px 60px rgba(0,0,0,0.18);
      border: 8px solid #fff; position: relative; overflow: hidden;
    }
    @media (min-width: 1100px) { .phone { width: 360px; } }
    .phone .bg {
      position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block;
      transition: filter .2s ease;
    }
    .grid-cells {
      position:absolute; inset:0; pointer-events:none;
    }
    .grid-cells .cell {
      position:absolute; border: 1px dashed rgba(0,0,0,0.35);
      background: rgba(255,255,255,0.06);
    }
    .text-element {
      position:absolute; left:50%; transform:translateX(-50%);
      padding:10px 14px; border-radius: 10px;
      background: rgba(255,255,255,0.65); backdrop-filter: blur(6px);
      font-weight: 800; color:#3b2417; cursor: move; user-select:none;
      border: 2px solid transparent; min-width: 60px; text-align: center;
    }
    .text-element.selected { border-color: #2563eb; }
    .sticker {
      position:absolute; font-size: 28px; cursor: move; user-select:none;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.15));
    }
    .shape {
      position:absolute; cursor: move; user-select:none;
      border: 3px solid #fff; border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.18);
    }

    /* Direita */
    .tools {
      background:#fff; border-left:1px solid rgba(0,0,0,0.06);
      padding: 16px 14px; display:flex; flex-direction:column; gap: 16px; overflow:auto;
    }
    .tool-section h3 {
      margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.6;
    }
    .tabs { display:flex; gap:8px; }
    .tab {
      flex:1; padding:10px; border-radius:12px; text-align:center; font-size:13px; font-weight:700;
      background:#f6f6f6; border:1px solid transparent; cursor:pointer;
    }
    .tab.active { background:#111; color:#fff; }
    .filters-grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; }
    .filter-card {
      aspect-ratio: 1/1; border-radius: 12px; overflow:hidden; cursor:pointer;
      border: 2px solid transparent; background:#e5e5e5;
    }
    .filter-card img { width:100%; height:100%; object-fit:cover; display:block; }
    .filter-card.active { border-color:#111; }
    .slider-row { display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13px; }
    .slider-row input[type="range"] { flex:1; accent-color:#111; }
    .quick-add { display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; }
    .quick-btn {
      aspect-ratio: 1/1; border-radius:12px; background:#f6f6f6;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
      font-size:11px; font-weight:700; cursor:pointer; border:1px solid transparent;
    }
    .quick-btn .ic { font-size: 22px; }
    .quick-btn.active { border-color:#111; background:#fff; }

    .overlay-controls {
      position:absolute; top: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,0.85); backdrop-filter: blur(8px);
      padding: 8px 10px; border-radius: 999px; display:flex; gap:8px; align-items:center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }
    .overlay-chip {
      padding: 6px 10px; border-radius: 999px; font-size: 11px; font-weight: 700;
      background:#fff; border:1px solid rgba(0,0,0,0.08);
    }
    .overlay-chip.active { background:#111; color:#fff; border-color:#111; }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar esquerda -->
    <aside class="sidebar">
      <div>
        <div class="brand">WANDERLAB</div>
        <div class="project">Projeto • Viagem Turquia</div>
      </div>
      <div class="nav-item active"><span class="icon">T</span> Texto</div>
      <div class="nav-item"><span class="icon">M</span> Mídia</div>
      <div class="nav-item"><span class="icon">★</span> Elementos</div>
      <div class="nav-item"><span class="icon">T</span> Texto</div>
      <div class="nav-item"><span class="icon">♫</span> Música</div>
      <div class="nav-item"><span class="icon">▦</span> Feed</div>
      <div style="margin-top:auto;" class="nav-item"><span class="icon">⚙</span> Ajustes</div>
    </aside>

    <!-- Centro -->
    <section class="center">
      <header class="topbar">
        <div style="font-weight:700; font-size:13px; opacity:0.75;">Story • 1080 × 1920</div>
        <div class="actions">
          <button class="btn" onclick="saveProject()">Salvo</button>
          <button class="btn" onclick="previewStory()">Pré-visualizar</button>
          <button class="btn primary" onclick="exportStory()">Exportar</button>
        </div>
      </header>
      <div class="canvas-wrap">
        <div class="phone" id="phone">
          <div class="overlay-controls">
            <span class="overlay-chip active">Story</span>
            <span class="overlay-chip">Post</span>
          </div>
          <img class="bg" id="bg" src="https://images.unsplash.com/photo-1500835556837-99ac94a94552?w=800&q=80" alt="fundo" />
          <div class="grid-cells" id="gridCells"></div>
          <div id="elements"></div>
        </div>
      </div>
    </section>

    <!-- Direita -->
    <aside class="tools">
      <div class="tool-section">
        <div class="tabs">
          <div class="tab active" onclick="switchTab(this, 'filters')">Editar</div>
          <div class="tab" onclick="switchTab(this, 'canvas')">Camadas</div>
        </div>
      </div>

      <!-- Filtros -->
      <div class="tool-section" id="panel-filters">
        <h3>Filtros</h3>
        <div class="filters-grid" id="filterGrid">
          <div class="filter-card active" data-filter="none" onclick="applyPresetFilter(this, 'none')">
            <img src="https://images.unsplash.com/photo-1500835556837-99ac94a94552?w=200&q=80" alt="original" />
          </div>
          <div class="filter-card" data-filter="clarea" onclick="applyPresetFilter(this, 'clarea')">
            <img src="https://images.unsplash.com/photo-1500835556837-99ac94a94552?w=200&q=80" alt="clarea" />
          </div>
          <div class="filter-card" data-filter="avella" onclick="applyPresetFilter(this, 'avella')">
            <img src="https://images.unsplash.com/photo-1500835556837-99ac94a94552?w=200&q=80" alt="avella" />
          </div>
          <div class="filter-card" data-filter="por-do-sol" onclick="applyPresetFilter(this, 'por-do-sol')">
            <img src="https://images.unsplash.com/photo-1500835556837-99ac94a94552?w=200&q=80" alt="por do sol" />
          </div>
        </div>
        <div style="margin-top:8px; font-size:12px; opacity:0.7;">Aplique um estilo simples</div>
      </div>

      <!-- Ajustes -->
      <div class="tool-section">
        <h3>Ajustes</h3>
        <div class="slider-row">
          <span>Brilho</span>
          <input type="range" id="brightness" min="0" max="200" value="100" oninput="applyAdjustments()" />
          <span id="brightnessVal">100</span>
        </div>
        <div class="slider-row">
          <span>Saturação</span>
          <input type="range" id="saturation" min="0" max="200" value="100" oninput="applyAdjustments()" />
          <span id="saturationVal">100</span>
        </div>
        <div class="slider-row">
          <span>Zoom da foto</span>
          <input type="range" id="zoom" min="100" max="200" value="100" oninput="applyAdjustments()" />
          <span id="zoomVal">100</span>
        </div>
      </div>

      <!-- Adicionar -->
      <div class="tool-section">
        <h3>Adicionar</h3>
        <div class="quick-add">
          <div class="quick-btn" onclick="addText('Título')">
            <span class="ic">T</span>
            <span>Texto</span>
          </div>
          <div class="quick-btn" onclick="addSticker('★')">
            <span class="ic">★</span>
            <span>Sticker</span>
          </div>
          <div class="quick-btn" onclick="addShape()">
            <span class="ic">▭</span>
            <span>Forma</span>
          </div>
          <div class="quick-btn" onclick="addLine()">
            <span class="ic">/</span>
            <span>Linha</span>
          </div>
        </div>
      </div>
    </aside>
  </div>

  <script>
    const phone = document.getElementById('phone');
    const bg = document.getElementById('bg');
    const gridCells = document.getElementById('gridCells');
    const elementsLayer = document.getElementById('elements');

    let currentFilter = 'none';
    let selectedEl = null;

    function switchTab(tabEl, panel) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tabEl.classList.add('active');
      document.querySelectorAll('.tool-section').forEach(s => s.style.display = 'none');
      const target = document.getElementById('panel-' + panel);
      if (target) target.style.display = 'block';
    }

    const presetFilters = {
      none: 'none',
      clarea: 'brightness(1.08) saturate(0.9) contrast(1.05)',
      avella: 'sepia(0.25) saturate(1.15) brightness(1.03)',
      'por-do-sol': 'sepia(0.35) saturate(1.25) brightness(1.02) hue-rotate(-8deg)'
    };

    function applyPresetFilter(el, name) {
      document.querySelectorAll('.filter-card').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      currentFilter = name;
      applyAdjustments();
    }

    function applyAdjustments() {
      const brightness = document.getElementById('brightness').value;
      const saturation = document.getElementById('saturation').value;
      const zoom = document.getElementById('zoom').value;

      document.getElementById('brightnessVal').textContent = brightness;
      document.getElementById('saturationVal').textContent = saturation;
      document.getElementById('zoomVal').textContent = zoom;

      const base = presetFilters[currentFilter] || 'none';
      const extra = `brightness(${brightness}%) saturate(${saturation}%)`;
      bg.style.filter = `${base} ${extra}`.trim();

      const scale = zoom / 100;
      bg.style.transform = `scale(${scale})`;
      bg.style.transformOrigin = 'center center';
    }

    function addText(preset) {
      const el = document.createElement('div');
      el.className = 'text-element';
      el.textContent = preset;
      el.style.top = '38%';
      el.style.fontSize = '26px';
      el.style.fontFamily = 'ui-serif, Georgia, serif';
      makeDraggable(el);
      elementsLayer.appendChild(el);
      selectElement(el);
    }
    function addSticker(content) {
      const el = document.createElement('div');
      el.className = 'sticker';
      el.textContent = content;
      el.style.top = '30%';
      el.style.left = '50%';
      el.style.transform = 'translate(-50%, -50%)';
      makeDraggable(el);
      elementsLayer.appendChild(el);
      selectElement(el);
    }
    function addShape() {
      const el = document.createElement('div');
      el.className = 'shape';
      el.style.width = '120px';
      el.style.height = '120px';
      el.style.top = '40%';
      el.style.left = '50%';
      el.style.transform = 'translate(-50%, -50%)';
      makeDraggable(el);
      elementsLayer.appendChild(el);
      selectElement(el);
    }
    function addLine() {
      const el = document.createElement('div');
      el.className = 'shape';
      el.style.width = '160px';
      el.style.height = '3px';
      el.style.background = '#fff';
      el.style.border = 'none';
      el.style.borderRadius = '999px';
      el.style.top = '50%';
      el.style.left = '50%';
      el.style.transform = 'translate(-50%, -50%)';
      makeDraggable(el);
      elementsLayer.appendChild(el);
      selectElement(el);
    }

    function makeDraggable(el) {
      let startX = 0, startY = 0, initLeft = 0, initTop = 0;
      el.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        selectElement(el);
        startX = e.clientX; startY = e.clientY;
        const rect = el.getBoundingClientRect();
        const parentRect = phone.getBoundingClientRect();
        initLeft = rect.left - parentRect.left + rect.width/2;
        initTop = rect.top - parentRect.top + rect.height/2;
        el.setPointerCapture(e.pointerId);
        el.addEventListener('pointermove', onMove);
        el.addEventListener('pointerup', onUp);
      });
      function onMove(e) {
        const dx = e.clientX - startX, dy = e.clientY - startY;
        el.style.left = (initLeft + dx) + 'px';
        el.style.top = (initTop + dy) + 'px';
        el.style.transform = 'translate(-50%, -50%)';
      }
      function onUp() {
        el.removeEventListener('pointermove', onMove);
        el.removeEventListener('pointerup', onUp);
      }
    }
    function selectElement(el) {
      if (selectedEl) selectedEl.classList.remove('selected');
      selectedEl = el;
      selectedEl.classList.add('selected');
    }
    document.addEventListener('pointerdown', (e) => {
      if (!e.target.closest('.text-element, .sticker, .shape')) {
        if (selectedEl) selectedEl.classList.remove('selected');
        selectedEl = null;
      }
    });

    function previewStory() {
      alert('Pré-visualização: em uma versão completa, abriria um modal em tela cheia.');
    }
    function exportStory() {
      alert('Exportar story: em uma versão completa, geraria PNG/JPG/WebP via canvas ou html2canvas.');
    }
    function saveProject() {
      alert('Projeto salvo localmente (simulação).');
    }
  </script>
</body>
</html>
