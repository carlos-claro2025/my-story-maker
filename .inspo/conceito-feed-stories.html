<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>my-story-maker — Conceito</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, sans-serif;
      background: #fafafa;
      color: #111;
    }
    .topbar {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 24px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .brand { font-weight: 800; letter-spacing: -0.3px; }
    .pill {
      display:inline-flex; align-items:center; gap:8px;
      padding: 8px 12px; border-radius: 999px;
      background: #111; color: #fff; font-weight: 600; font-size: 14px;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 24px; }
    .grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }
    @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
    .panel {
      background: #fff; border-radius: 16px;
      box-shadow: 0 1px 0 rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06);
      overflow: hidden;
    }
    .panel h2 {
      margin: 0; padding: 14px 16px;
      font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.7;
    }
    .feed {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px; padding: 10px;
    }
    .tile {
      aspect-ratio: 1 / 1; border-radius: 12px; overflow: hidden;
      background: linear-gradient(135deg, #ffd6ba, #ffcfba, #f4c2c2);
      position: relative;
    }
    .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tile .overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.25), transparent 40%);
    }
    .editor {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 14px; padding: 14px;
    }
    @media (max-width: 860px) { .editor { grid-template-columns: 1fr; } }
    .canvas {
      aspect-ratio: 9/16; border-radius: 14px;
      background: linear-gradient(180deg, #bde0fe 0%, #a2d2ff 35%, #ffafcc 100%);
      position: relative; overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
    }
    .canvas .art {
      position: absolute; inset: 0;
      background:
        radial-gradient(circle at 25% 30%, rgba(255,255,255,0.6), transparent 30%),
        radial-gradient(circle at 75% 40%, rgba(255,255,255,0.5), transparent 28%),
        linear-gradient(180deg, #d0f0fd, #ffd7e8);
    }
    .canvas .title {
      position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
      font-family: "Playfair Display", ui-serif, Georgia, serif;
      font-size: 38px; color: #3b2417; text-align: center;
      text-shadow: 0 2px 0 rgba(255,255,255,0.4);
    }
    .tools { display: flex; flex-direction: column; gap: 10px; }
    .tool {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; border-radius: 12px;
      background: #f6f6f6;
    }
    .tool .label { font-weight: 700; font-size: 13px; }
    .tool .hint { font-size: 12px; opacity: 0.7; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      padding: 6px 10px; border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.08); background: #fff;
      font-size: 12px; font-weight: 600;
    }
    .chip.active { background: #111; color: #fff; border-color: #111; }
    .text-layer {
      position: absolute; left: 50%; top: 56%; transform: translate(-50%, -50%);
      background: rgba(255,255,255,0.55);
      padding: 10px 14px; border-radius: 999px;
      backdrop-filter: blur(4px);
      font-weight: 700; color: #3b2417;
    }
    .kbd {
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 8px;
      background: #fff; border: 1px solid rgba(0,0,0,0.08);
      box-shadow: 0 1px 0 rgba(0,0,0,0.06);
      font-size: 11px; font-weight: 800;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">my-story-maker</div>
    <div class="pill">
      <span>Novo projeto</span>
      <span class="kbd">N</span>
    </div>
  </header>

  <main class="wrap">
    <div class="grid">
      <!-- Coluna esquerda: feed de fotos -->
      <section class="panel">
        <h2>Pré-visualização no formato feed</h2>
        <div class="feed">
          <div class="tile"><img src="https://images.unsplash.com/photo-1520839090488-4a6c211e2f94?w=400&q=80" alt="foto"><div class="overlay"></div></div>
          <div class="tile"><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400&q=80" alt="foto"><div class="overlay"></div></div>
          <div class="tile"><img src="https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?w=400&q=80" alt="foto"><div class="overlay"></div></div>
          <div class="tile"><img src="https://images.unsplash.com/photo-1500530855699-b59d19a91e26?w=400&q=80" alt="foto"><div class="overlay"></div></div>
          <div class="tile"><img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=400&q=80" alt="foto"><div class="overlay"></div></div>
          <div class="tile"><img src="https://images.unsplash.com/photo-1469854523086-cc02fe5d8800?w=400&q=80" alt="foto"><div class="overlay"></div></div>
          <div class="tile"><img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=400&q=80" alt="foto"><div class="overlay"></div></div>
          <div class="tile"><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=400&q=80" alt="foto"><div class="overlay"></div></div>
          <div class="tile"><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=400&q=80" alt="foto"><div class="overlay"></div></div>
        </div>
      </section>

      <!-- Coluna direita: editor -->
      <section class="panel">
        <h2>Editor de stories</h2>
        <div class="editor">
          <div class="canvas">
            <div class="art"></div>
            <div class="title">Romantic Turkey</div>
            <div class="text-layer">✨ Capadócia</div>
          </div>

          <div class="tools">
            <div class="tool">
              <div>
                <div class="label">Templates</div>
                <div class="hint">grade, revista, clássico</div>
              </div>
            </div>
            <div class="chips">
              <span class="chip active">Sem grade</span>
              <span class="chip">Grade 2x2</span>
              <span class="chip">Grade 3x3</span>
            </div>

            <div class="tool">
              <div>
                <div class="label">Filtros</div>
                <div class="hint">brilho, contraste, calor</div>
              </div>
            </div>
            <div class="chips">
              <span class="chip active">Natural</span>
              <span class="chip">Quente</span>
              <span class="chip">Frio</span>
              <span class="chip">Vintage</span>
            </div>

            <div class="tool">
              <div>
                <div class="label">Texto</div>
                <div class="hint">estilo, cor, alinhamento</div>
              </div>
            </div>
            <div class="chips">
              <span class="chip">Título</span>
              <span class="chip">Legenda</span>
              <span class="chip">Hashtag</span>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
